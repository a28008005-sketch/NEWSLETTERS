name: 워크시트 생성 요청 처리

# 노션 '워크시트 만들기 요청' 에 올라온 대기 건을 처리한다.
# 선생님은 노션에 한 줄 적기만 하면 되고, 나머지는 여기서 끝난다.
on:
  schedule:
    - cron: '7 * * * *'   # 매시 7분
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: worksheet-requests
  cancel-in-progress: false

jobs:
  handle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 한글 글꼴 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum
          sudo fc-cache -f

      - name: 요청 처리
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
          NOTION_REQUEST_DB_ID: ${{ vars.NOTION_REQUEST_DB_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node src/cli.js requests

      # 만들어진 워크시트를 저장소에 남긴다. 나중에 문항을 고치거나 다시 뽑을 수 있어야 한다.
      - name: 만들어진 워크시트 저장
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/worksheets/ drafts/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "새로 만들어진 워크시트가 없습니다."
            exit 0
          fi
          git commit -m "Add worksheets generated from Notion requests"
          git push origin HEAD:main

      - name: PDF 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worksheet-pdfs
          path: out/*.pdf
          if-no-files-found: ignore
