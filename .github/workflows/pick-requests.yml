name: 새 기사 찾아오기

# 레벨을 받아 마스터 목록에 아직 없는 기사를 찾고, 본문·사진·음원을 받아 둔다.
# 마스터 목록만 읽으면 되므로 통합에 추가 권한이 필요 없다.
on:
  workflow_dispatch:
    inputs:
      level:
        description: '리딩 레벨 (K1 / G2 / G3-4 / G5-6)'
        required: true
        default: 'K1'
        type: choice
        options: ['K1', 'G2', 'G3-4', 'G5-6']

permissions:
  contents: write

concurrency:
  group: worksheet-requests
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 새 기사 찾기
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
        run: node src/cli.js discover "${{ inputs.level }}"

      - name: 초안 커밋
        if: always()
        run: |
          if [ -z "$(ls -A drafts 2>/dev/null)" ]; then exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drafts/
          if git diff --cached --quiet; then echo "새 초안이 없습니다."; exit 0; fi
          git commit -m "Add article draft discovered for a worksheet request"
          git push origin HEAD:main
